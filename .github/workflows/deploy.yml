name: Build & Deploy

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to switch branches

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Push the built index.html directly to main so Pages deploys it
      - name: Deploy to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp $GITHUB_WORKSPACE/dist/index.html index.html
          git add index.html
          git diff --staged --quiet || git commit -m "build: deploy from ${{ github.ref_name }} [skip ci]"
          git push origin main

      # Enable GitHub Pages from main branch root (idempotent)
      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pages \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -f build_type=legacy \
            -f "source[branch]=main" \
            -f "source[path]=/" \
            2>/dev/null || \
          gh api repos/${{ github.repository }}/pages \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -f "source[branch]=main" \
            -f "source[path]=/" \
            2>/dev/null || true
