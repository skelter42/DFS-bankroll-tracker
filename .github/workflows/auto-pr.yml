name: Auto-create PR

on:
  push:
    branches: ['claude/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "$(git log -1 --pretty=%s)" \
            --body "Auto-opened from branch \`${{ github.ref_name }}\` on push." \
            2>/dev/null || echo "PR already exists, skipping."
